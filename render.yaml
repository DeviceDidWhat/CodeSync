services:
  # Redis for queue management
  - type: redis
    name: codesync-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction

  # Backend API with Docker support
  - type: web
    name: codesync-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false  # Add this manually in Render dashboard
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: codesync-redis
          property: connectionString
      - key: CLIENT_URL
        value: https://codesync-frontend.onrender.com  # Update this with your actual frontend URL

  # Frontend static site
  - type: web
    name: codesync-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: codesync-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_STREAM_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
